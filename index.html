<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERY CLASS XI-TKJ-1 | Liquid Glass</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-24">

    <div class="blob-container">
        <div class="blob blob-1" id="blob1"></div>
        <div class="blob blob-2" id="blob2"></div>
        <div class="blob blob-3" id="blob3"></div>
    </div>

    <nav class="fixed top-4 left-4 right-4 z-50 liquid-glass rounded-2xl px-6 py-3 flex justify-between items-center">
        <h1 class="text-sm md:text-lg font-bold tracking-wider text-white">GALERY CLASS <span class="text-[var(--primary)]">XI-TKJ-1</span></h1>
        <div class="flex gap-4">
            <button onclick="playMusic()" class="text-2xl hover:scale-110 transition">🎵</button>
            <button onclick="changeTheme()" class="text-2xl hover:scale-110 transition">🎨</button>
        </div>
    </nav>

    <main class="pt-28 px-4 max-w-6xl mx-auto space-y-12">
        <section class="text-center liquid-glass rounded-3xl p-10 relative">
            <h2 class="title-glass mb-4">GALERY CLASS XI-TKJ-1</h2>
            <p class="text-gray-300 mb-8 font-light text-lg">Bingkai Kenangan dalam Balutan Kaca.</p>
            <div class="flex flex-wrap justify-center gap-4">
                <button onclick="rollRandomMemory()" class="px-8 py-3 liquid-glass rounded-full font-bold hover:bg-white/10 transition">🎲 Acak Kenangan</button>
                <button onclick="openUpload()" class="px-8 py-3 bg-[var(--primary)] rounded-full font-bold text-black hover:scale-105 transition shadow-[0_0_20px_var(--primary)]">Upload Foto</button>
            </div>
        </section>

        <section class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2">
                <button onclick="filterAlbum('all')" class="album-tab tab-active px-5 py-2 liquid-glass rounded-full text-sm">Semua</button>
                <button onclick="filterAlbum('wisata')" class="album-tab px-5 py-2 liquid-glass rounded-full text-sm text-gray-400 hover:text-white">Wisata</button>
                <button onclick="filterAlbum('bukber')" class="album-tab px-5 py-2 liquid-glass rounded-full text-sm text-gray-400 hover:text-white">Bukber</button>
                <button onclick="filterAlbum('praktek')" class="album-tab px-5 py-2 liquid-glass rounded-full text-sm text-gray-400 hover:text-white">Praktek</button>
            </div>
            <input type="text" id="searchInput" onkeyup="searchPhotos()" placeholder="Cari kenangan..." class="w-full md:w-64 px-5 py-2 liquid-glass rounded-full text-sm outline-none focus:ring-2 ring-[var(--primary)]">
        </section>

        <section id="galleryGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 card-container"></section>

        <section class="liquid-glass rounded-3xl p-6 relative h-[400px] flex flex-col items-center justify-center overflow-hidden">
            <h3 class="text-xl font-bold mb-4 z-10 text-white drop-shadow-lg">Geser Kartu</h3>
            <div class="relative w-64 h-80" id="cardStack"></div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="liquid-glass rounded-3xl p-6">
                <h3 class="text-xl font-bold mb-4 text-center">Siapa Paling Rajin?</h3>
                <div id="votingContainer" class="space-y-3"></div>
            </div>
            <div class="liquid-glass rounded-3xl p-6 relative overflow-hidden h-96" id="guestbookContainer">
                <h3 class="text-xl font-bold mb-4 text-center sticky top-0 z-10 bg-black/50 p-2 rounded-lg backdrop-blur">Buku Tamu</h3>
            </div>
        </section>
    </main>

    <div id="lightbox" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center backdrop-blur-xl">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-3xl z-50 text-white">✕</button>
        <div class="relative w-full max-w-3xl p-4 flex flex-col items-center">
            <div id="lightboxImageContainer" class="relative group w-full aspect-video md:aspect-auto md:h-[60vh] bg-black rounded-xl overflow-hidden cursor-zoom-in" ondblclick="triggerDoubleTapLike()">
                <img id="lightboxImage" src="" class="w-full h-full object-contain transition-transform duration-300">
                <div id="likeOverlay" class="absolute inset-0 flex items-center justify-center pointer-events-none"></div>
            </div>
            <div class="w-full mt-4 liquid-glass p-4 rounded-xl flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div class="flex gap-2 relative">
                        <button onclick="addReaction('❤️')" class="text-2xl hover:scale-125 transition">❤️ <span id="count-❤️" class="text-sm ml-1">0</span></button>
                        <button onclick="addReaction('😂')" class="text-2xl hover:scale-125 transition">😂 <span id="count-😂" class="text-sm ml-1">0</span></button>
                        <button onclick="addReaction('🔥')" class="text-2xl hover:scale-125 transition">🔥 <span id="count-🔥" class="text-sm ml-1">0</span></button>
                    </div>
                    <button onclick="downloadImage()" class="px-3 py-1 bg-white/10 rounded-lg text-sm hover:bg-white/20">Download</button>
                </div>
                <div class="border-t border-white/10 pt-2">
                    <div id="commentsList" class="max-h-32 overflow-y-auto space-y-2 mb-2 text-sm"></div>
                    <div class="flex gap-2 relative">
                        <input type="text" id="commentName" placeholder="Nama" class="w-1/3 px-2 py-1 bg-white/5 rounded text-sm outline-none">
                        <input type="text" id="commentText" placeholder="Ketik @ untuk tag..." class="flex-1 px-2 py-1 bg-white/5 rounded text-sm outline-none" onkeyup="handleTag(this)">
                        <button onclick="addComment()" class="bg-[var(--primary)] text-black px-3 py-1 rounded font-bold text-sm">Kirim</button>
                        <div id="tagSuggestions" class="absolute bottom-full left-1/3 bg-gray-800 rounded-lg shadow-lg hidden w-48 max-h-32 overflow-y-auto z-50"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute bottom-6 flex gap-4 text-2xl">
            <button onclick="prevImage()" class="p-3 liquid-glass rounded-full hover:bg-white/10">←</button>
            <button onclick="nextImage()" class="p-3 liquid-glass rounded-full hover:bg-white/10">→</button>
        </div>
    </div>

    <div id="uploadModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="liquid-glass w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="closeUpload()" class="absolute top-4 right-4 text-xl">✕</button>
            <h3 class="text-xl font-bold mb-4">Upload Foto Baru</h3>
            <div id="dropZone" class="border-2 border-dashed border-white/30 rounded-xl h-40 flex items-center justify-center mb-4 text-gray-400 cursor-pointer relative overflow-hidden" onclick="document.getElementById('fileInput').click()">
                <span>Pilih Foto</span>
                <img id="previewImg" class="absolute inset-0 w-full h-full object-cover hidden">
            </div>
            <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewFile(event)">
            <button onclick="proceedToCrop()" class="w-full py-2 bg-[var(--primary)] text-black font-bold rounded-lg mb-2 hidden" id="btnProceed">Lanjut Crop & Edit</button>
            <div id="cropperArea" class="hidden w-full h-64 bg-black rounded mb-4"><img id="imageToCrop" class="block max-w-full"></div>
            <div id="editTools" class="hidden space-y-2 mb-4">
                <select id="filterSelect" class="w-full p-2 bg-black/50 rounded text-white border border-white/20">
                    <option value="none">Tanpa Filter</option>
                    <option value="grayscale">Hitam Putih</option>
                    <option value="sepia">Vintage</option>
                    <option value="brightness(1.2)">Cerah</option>
                </select>
                <input type="text" id="stickerInput" placeholder="Teks/Stiker..." class="w-full p-2 bg-black/50 rounded border border-white/20 text-sm">
            </div>
            <button onclick="saveUpload()" class="w-full py-2 bg-green-500 text-black font-bold rounded-lg hidden" id="btnSave">Simpan ke Galeri</button>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://res.cloudinary.com/pgoqyqng/video/upload/v1794031699/About_You_-_The_1975_Instrumental.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
